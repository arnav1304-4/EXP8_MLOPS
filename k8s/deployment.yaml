apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-app
  template:
    metadata:
      labels:
        app: iris-app
    spec:
      containers:
        - name: iris-app
          image: iris-app:E002
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
